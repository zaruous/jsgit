# push·pull request 마다 타입 검사와 테스트 (앱들과 같은 Windows·Node 24)
name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # 공급망: lockfile 그대로, 설치 스크립트 실행 안 함
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npx vitest run
